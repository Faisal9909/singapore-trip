<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جدول رحلتنا</title>

<style>
:root{--bg:#FAFAF8;--fg:#1B1F1D;--muted:#6B726E;--line:#E4E6E3;--accent:#0B7566;--soft:#E3F0EC;--card:#FFFFFF;--no:#B4402C;
  --display:"Noto Kufi Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#121514;--fg:#E8ECEA;--muted:#9AA39F;--line:#262B29;--accent:#4CC2AE;--soft:#16302A;--card:#1A1F1D;--no:#EE8471;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.9}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.5;text-wrap:balance}
h1{font-size:1.6rem}
h2{font-size:1.3rem;margin-top:44px;padding-bottom:6px;border-bottom:2px solid var(--fg)}
h3{font-size:1rem;margin-top:30px;color:var(--accent)}
h3 small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a{font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:2px 12px;background:var(--card)}
.gate{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.gate p{margin:0;font-size:.9rem}
form.row{display:flex;gap:8px;flex-wrap:wrap}
form.row input{font:inherit;font-size:.95rem;flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
form.row button,.addbtn{font:inherit;font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--card);cursor:pointer}
ul{margin:10px 0 0;padding-right:20px;display:flex;flex-direction:column;gap:12px;list-style:disc}
li::marker{color:var(--accent)}
li b{font-weight:600}
li span.d{display:block;color:var(--muted);font-size:.95rem}
li .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:2px}
li .act button{font:inherit;font-size:.8rem;background:none;border:0;padding:0;color:var(--no);cursor:pointer;text-decoration:underline}
li.off b,li.off span.d{text-decoration:line-through;opacity:.55}
li.off .act button{color:var(--accent)}
li.added::marker{color:var(--no)}
.addbtn{background:none;color:var(--accent);border:1px dashed var(--accent);margin-top:12px;font-weight:600}
form.add{margin-top:10px;display:flex;flex-direction:column;gap:8px}
form.add input{font:inherit;font-size:.95rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
form.add .btns{display:flex;gap:8px}
form.add .btns button{font:inherit;font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:var(--card)}
form.add .btns button.cancel{background:none;color:var(--muted);border:1px solid var(--line)}
li img.ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-top:8px;background:var(--line)}
li.off img.ph{opacity:.35;filter:grayscale(1)}
.mapbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.mapbox svg{display:block;width:100%;height:auto}
.pinno{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:#13201B;color:#fff;font-size:.75rem;font-weight:700;margin-left:6px;vertical-align:2px;font-variant-numeric:tabular-nums}
li.off .pinno{background:var(--muted)}
details.cred{margin-top:48px;font-size:.85rem;color:var(--muted)}
details.cred ul{gap:2px;list-style:none;padding:0}
details.cred a{color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head><body>
